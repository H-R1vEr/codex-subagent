name: Validate skills and installers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_docs.py
      - name: PowerShell wrapper smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Destination "${{ runner.temp }}/researchflow-powershell" -Skill evidence-chain
      - name: Bash wrapper smoke
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/install.sh --destination "${{ runner.temp }}/researchflow-bash" --skill evidence-chain
